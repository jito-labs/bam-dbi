[package]
name = "bam-direct-bundle-examples"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "send-bam-json-rpc-bundle"
path = "src/bin/send_bam_json_rpc_bundle.rs"

[[bin]]
name = "send-bam-quic-bundle"
path = "src/bin/send_bam_quic_bundle.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde_json = "1.0"
solana-keypair = "3.1.2"
solana-tls-utils = { version = "3.1.9", features = ["agave-unstable-api"] }
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "time"] }
